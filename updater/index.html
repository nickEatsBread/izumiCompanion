<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' http://tizen.org; connect-src http://127.0.0.1:18763; style-src 'self'; img-src 'self' data:">
  <title>izumi Updater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <img class="wordmark" src="wordmark.svg" alt="izumi">
    <p class="eyebrow">TV UPDATER</p>
    <h1 id="title">Keep the good<br>things coming.</h1>
    <p id="message" role="status" aria-live="polite">Starting your update service…</p>
    <div class="versions"><span>Installed <strong id="installed">—</strong></span><span>Latest <strong id="latest">—</strong></span></div>
    <p id="setup-code" hidden></p>
    <div id="progress-wrap" hidden><div id="progress" role="progressbar" aria-label="Update progress"><i id="progress-fill"></i></div><span id="progress-label"></span></div>
    <div class="actions">
      <button id="primary" disabled>Checking…</button>
      <button id="open" class="secondary">Open izumi</button>
    </div>
    <p id="help">Updates use the Samsung signing identity set up by your desktop installer.</p>
  </main>
  <div class="art" aria-hidden="true"><img src="icon.png" alt=""></div>
  <script src="ui.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix updater --ignore-scripts
      - run: npm run check
      - run: npm run build:all
      - run: node scripts/package-companion.mjs
      - run: node scripts/verify-release.mjs

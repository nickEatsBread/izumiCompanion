name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix updater --ignore-scripts
      - run: node scripts/release-version.mjs
      - name: Check desktop installer when included
        if: hashFiles('installer/package.json') != ''
        run: |
          npm ci --prefix installer --ignore-scripts
          npm test --prefix installer
      - run: npm run check
      - run: npm run build:all
      - run: node scripts/package-companion.mjs
      - run: node scripts/verify-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 4.4.3
      - name: Verify the packaged updater on the TV Node runtime
        run: node scripts/check-updater-node4.cjs

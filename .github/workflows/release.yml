name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            updater/package-lock.json
      - run: node scripts/release-version.mjs --require-installer
      - run: npm ci
      - run: npm ci --prefix updater --ignore-scripts
      - run: npm run check
      - run: npm run build:all
      - run: node scripts/package-companion.mjs
      - run: node scripts/verify-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 4.4.3
      - name: Verify the packaged updater on the TV Node runtime
        run: node scripts/check-updater-node4.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: izumi-tv-widgets
          path: artifacts/*.wgt
          if-no-files-found: error
  installers:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            updater/package-lock.json
            installer/package-lock.json
      - run: npm ci
      - run: npm ci --prefix updater --ignore-scripts
      - run: npm ci --prefix installer
      - run: npm test --prefix installer
      - run: npm run assets --prefix installer
      - name: Build desktop installer
        run: npm run dist:${{ matrix.target }} --prefix installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: izumi-installer-${{ matrix.target }}
          path: |
            installer/dist/*.exe
            installer/dist/*.dmg
            installer/dist/*.AppImage
          if-no-files-found: error
  mobile:
    needs: packages
    uses: ./.github/workflows/mobile.yml
    secrets: inherit
  draft:
    needs: [packages, installers, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create and verify the complete draft release
        run: node scripts/draft-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

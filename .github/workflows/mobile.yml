name: Build mobile installer
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      IZUMI_MOBILE_ANDROID_KEYSTORE:
        required: false
      IZUMI_MOBILE_ANDROID_PASSWORD:
        required: false
  push:
    branches: [main]
    paths: ['mobile/**', 'installer/**', 'updater/runtime/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'installer/**', 'updater/runtime/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Android
          - os: macos-latest
            platform: iOS
    runs-on: ${{ matrix.os }}
    env:
      NODEJS_MOBILE_BUILD_NATIVE_MODULES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            installer/package-lock.json
            updater/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix updater --ignore-scripts
      - run: npm ci --prefix installer --ignore-scripts
      - run: npm test --prefix installer
      - run: npm run assets --prefix installer
      - run: npm run cloudflare --prefix installer
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: node mobile/scripts/icons.cjs
      - run: npm run prepareRuntime --prefix mobile
      - run: npm test --prefix mobile
      - uses: actions/setup-java@v4
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'Android'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'Android'
      - name: Build Android APK
        if: matrix.platform == 'Android'
        working-directory: mobile/android
        env:
          MOBILE_KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.IZUMI_MOBILE_ANDROID_KEYSTORE || '' }}
          IZUMI_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.IZUMI_MOBILE_ANDROID_PASSWORD || '' }}
          IZUMI_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.IZUMI_MOBILE_ANDROID_PASSWORD || '' }}
          IZUMI_ANDROID_KEY_ALIAS: izumi-installer
        run: |
          variant=debug
          if [ -n "$MOBILE_KEYSTORE" ]; then
            umask 077
            export IZUMI_ANDROID_STORE_FILE="$RUNNER_TEMP/izumi-installer.p12"
            printf '%s' "$MOBILE_KEYSTORE" | base64 --decode > "$IZUMI_ANDROID_STORE_FILE"
            trap 'rm -f "$IZUMI_ANDROID_STORE_FILE"' EXIT
            bash gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
            variant=release
          else
            if [ "${{ github.ref_type }}" = tag ]; then echo 'Release signing is not configured.' >&2; exit 1; fi
            bash gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
          fi
          version=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp "app/build/outputs/apk/$variant/app-$variant.apk" "../dist/izumi-Companion-Installer-$version-Android.apk"
      - name: Build unsigned iPhone app
        if: matrix.platform == 'iOS'
        working-directory: mobile/ios
        run: |
          pod install
          xcodebuild -workspace IzumiInstaller.xcworkspace -scheme IzumiInstaller -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          mkdir -p unsigned/Payload
          cp -R build/Build/Products/Release-iphoneos/IzumiInstaller.app unsigned/Payload/
          cd unsigned
          version=$(node -p "require('../../package.json').version")
          zip -qry "izumi-Companion-Installer-$version-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: izumi-installer-${{ matrix.platform }}
          path: |
            mobile/dist/*.apk
            mobile/ios/unsigned/*.ipa
          if-no-files-found: error

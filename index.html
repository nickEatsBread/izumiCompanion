<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <title>Izumi Companion</title>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="./libs/msf-2.3.3.min.js"></script>
  </head>
  <body>
    <object id="av-player" type="application/avplayer"></object>
    <div id="app">
      <main id="launch-fallback" role="status" style="width:100%;height:100%;padding:9vh 8vw;background:#07111e;color:#f6f6f6;font-family:Arial,sans-serif;box-sizing:border-box">
        <p style="margin:0 0 18px;color:#7dd3fc;font-size:20px;font-weight:700;letter-spacing:3px">IZUMI COMPANION</p>
        <h1 style="margin:0 0 22px;font-size:54px;line-height:1.05">Starting TV client…</h1>
        <p id="launch-fallback-detail" style="margin:0;color:#d4d9df;font-size:26px;line-height:1.45">Preparing your paired library and receiver.</p>
      </main>
    </div>
    <script>
      (function () {
        function showLaunchError(message) {
          var fallback = document.getElementById('launch-fallback')
          var detail = document.getElementById('launch-fallback-detail')
          if (fallback && detail) detail.textContent = message
        }
        window.onerror = function (message, source, line, column) {
          showLaunchError('Startup error: ' + String(message) + ' (' + String(line || 0) + ':' + String(column || 0) + ')')
          return false
        }
        window.onunhandledrejection = function (event) {
          var reason = event && event.reason
          showLaunchError('Startup error: ' + String(reason && reason.message ? reason.message : reason || 'Promise rejected'))
        }
        window.setTimeout(function () {
          showLaunchError('The application bundle did not start. Reinstall or update izumi companion.')
        }, 12000)
      }())
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
